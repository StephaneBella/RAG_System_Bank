name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
        run: uv run pytest

      # The RAG security tests (SEC-01, SEC-02, US-07) are skipped above: they need the
      # optional "rag" dependency group. Install it from the lock and fail if it cannot
      # be imported, so that these tests can never be skipped silently here.
      - name: Install RAG dependencies
        run: |
          uv sync --locked --group rag
          uv run --locked --group rag python -c "import langchain_classic, llama_index.core, qdrant_client"

      - name: Run RAG security tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run --locked --group rag pytest
          tests/test_rag_access.py tests/test_rag_audit.py
          tests/test_rag_llm_adapters.py tests/test_main_rag.py

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

[project]
name = "rag-bank-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

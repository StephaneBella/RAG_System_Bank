[project]
name = "rag-bank-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# This is a tool that will be used for automatically formatting the code
# to make sur it follows the correct python 3.11 synthax
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

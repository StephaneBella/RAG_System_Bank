[project]
name = "rag-bank-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "langchain>=1.4.8",
    "langchain-classic>=1.0.8",
    "langchain-groq>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.19",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-anthropic>=0.12.3",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-retrievers-bm25>=0.8.0",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.0",
    "pystemmer>=2.2.0.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# This is a tool that will be used for automatically formatting the code
# to make sur it follows the correct python 3.11 synthax
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
